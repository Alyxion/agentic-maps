<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>agentic-maps — Overlay-Galerie</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/map.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2f1ef;
    font-family: 'Helvetica Neue', -apple-system, Arial, sans-serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #map { position: absolute; inset: 0; }

  /* The panel is the point of the gallery: each sample states the question it
     answers and what it is not allowed to claim. */
  #panel {
    position: absolute; top: 16px; left: 16px; z-index: 10; width: 340px;
    background: rgba(255,255,255,0.97); border-radius: 12px; padding: 18px 20px 16px;
    box-shadow: 0 8px 30px rgba(20,26,34,0.16); color: #1f2733;
  }
  #panel .step { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: #8b95a1; }
  #panel h1 { font-size: 19px; margin: 6px 0 4px; font-weight: 600; }
  #panel .question { font-size: 14px; color: #46596e; margin-bottom: 10px; }
  #panel .note { font-size: 12.5px; line-height: 1.5; color: #6a7280;
    border-left: 3px solid #dfe3e8; padding-left: 10px; }
  #panel .nav { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  #panel button {
    border: 1px solid #dfe4ea; background: #fff; border-radius: 8px;
    padding: 7px 13px; font-size: 13px; cursor: pointer; color: #2b3543;
  }
  #panel button:hover { background: #f2f6fb; }
  #panel .count { margin-left: auto; font-size: 12px; color: #8b95a1; }

  /* The ramp, shown so a reader knows which end is which. */
  #legend { margin-top: 14px; display: none; }
  #legend.open { display: block; }
  #legend .bar { height: 9px; border-radius: 5px; }
  #legend .ends { display: flex; justify-content: space-between;
    font-size: 11.5px; color: #6a7280; margin-top: 5px; }

  #busy { position: absolute; left: 50%; top: 20px; transform: translateX(-50%);
    background: rgba(20,26,34,0.88); color: #eef3f8; font-size: 13px;
    padding: 8px 15px; border-radius: 999px; z-index: 11; display: none; }
  #busy.open { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="map" data-agentic-map data-agentic-spec-url="/api/demo-spec"></div>
  <div id="busy"></div>
  <div id="panel">
    <div class="step" id="kind"></div>
    <h1 id="title"></h1>
    <div class="question" id="question"></div>
    <div class="note" id="note"></div>
    <div id="legend"><div class="bar"></div>
      <div class="ends"><span id="legend-low"></span><span id="legend-high"></span></div></div>
    <div class="nav">
      <button id="prev">← Zurück</button>
      <button id="next">Weiter →</button>
      <span class="count" id="count"></span>
    </div>
  </div>
</div>

<script src="/vendor/maplibre-gl.js"></script>
<script src="/vendor/basemaps.js"></script>
<script src="/road-styles.js"></script>
<script src="/palette-canvas.js"></script>
<script src="/heatmaps.js"></script>
<script src="/map.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const map = await window.agenticMountMaps().then((maps) => maps[0]);
  const gallery = await fetch('/api/overlay-samples').then((r) => r.json());
  const CENTRE = gallery.centre;


  let index = 0;
  let active = [];

  const busy = (text) => {
    $('busy').textContent = text || '';
    $('busy').classList.toggle('open', !!text);
  };

  // Stand-in data. Real hosts pass their own; these exist so the sample shows
  // the shape of the answer rather than an empty map.
  function scatter(centre, count, spreadDeg, weightBias) {
    const points = [];
    for (let i = 0; i < count; i++) {
      // Deterministic, so stepping back and forth does not reshuffle the map.
      const a = Math.sin(i * 12.9898) * 43758.5453;
      const b = Math.sin(i * 78.233) * 12345.6789;
      const jitterA = a - Math.floor(a), jitterB = b - Math.floor(b);
      points.push({
        lon: centre[0] + (jitterA - 0.5) * spreadDeg * 1.6,
        lat: centre[1] + (jitterB - 0.5) * spreadDeg,
        weight: 0.3 + ((jitterA + jitterB) / 2) * (weightBias || 1),
      });
    }
    return points;
  }

  function box(centre, dLon, dLat, colour, name) {
    return {
      type: 'Feature',
      properties: { color: colour, name },
      geometry: { type: 'Polygon', coordinates: [[
        [centre[0] - dLon, centre[1] - dLat], [centre[0] + dLon, centre[1] - dLat],
        [centre[0] + dLon, centre[1] + dLat], [centre[0] - dLon, centre[1] + dLat],
        [centre[0] - dLon, centre[1] - dLat]]] },
    };
  }

  async function build(sample) {
    agenticHeat.removeAll(map.map, active);
    active = [];
    $('legend').classList.toggle('open', sample.kind !== 'none' && sample.kind !== 'highlight');
    const ramp = agenticHeat.RAMP;
    $('legend').querySelector('.bar').style.background =
      'linear-gradient(90deg,' + ramp.join(',') + ')';

    if (sample.kind === 'radial') {
      $('legend-low').textContent = 'nah'; $('legend-high').textContent = 'fern';
      active = agenticHeat.radial(map.map, Object.assign(
        { id: 'sample', centre: CENTRE }, sample.options));
    } else if (sample.kind === 'isodistance') {
      $('legend-low').textContent = 'schnell erreichbar';
      $('legend-high').textContent = 'weit weg';
      busy('Reichweite wird über die Routing-Matrix gemessen …');
      try {
        active = await agenticHeat.isodistance(map.map, Object.assign(
          { id: 'sample', centre: CENTRE }, sample.options));
        busy(active.probes + ' Messpunkte über die Straßen-Matrix');
        setTimeout(() => busy(''), 3500);
      } catch (error) {
        // The public OSRM caps its table service, so this can legitimately
        // fail — saying so beats an empty map that looks like a bug.
        busy('Matrix nicht verfügbar: ' + error.message);
        setTimeout(() => busy(''), 6000);
      }
    } else if (sample.kind === 'cluster') {
      $('legend-low').textContent = 'wenig'; $('legend-high').textContent = 'viel';
      active = agenticHeat.cluster(map.map, {
        id: 'sample', points: scatter(CENTRE, 220, 0.055, 1.4), radiusPx: 46,
      });
    } else if (sample.kind === 'multi') {
      $('legend-low').textContent = 'ein Zentrum';
      $('legend-high').textContent = 'Überlagerung';
      // Three centres with different reach — the intersections are the point.
      const centres = [
        { at: CENTRE, spread: 0.030, count: 150 },
        { at: [CENTRE[0] + 0.075, CENTRE[1] + 0.022], spread: 0.016, count: 90 },
        { at: [CENTRE[0] - 0.055, CENTRE[1] - 0.030], spread: 0.045, count: 130 },
      ];
      centres.forEach((c, i) => {
        active = active.concat(agenticHeat.cluster(map.map, {
          id: 'sample-' + i, points: scatter(c.at, c.count, c.spread, 1),
          radiusPx: 34 + i * 12, opacity: 0.45,
        }));
      });
    } else if (sample.kind === 'highlight') {
      active = agenticHeat.highlight(map.map, {
        id: 'sample',
        features: [
          box(CENTRE, 0.022, 0.012, agenticHeat.RAMP[1], 'Kerngebiet'),
          box([CENTRE[0] + 0.06, CENTRE[1] + 0.02], 0.018, 0.010, agenticHeat.RAMP[3], 'Erweiterung'),
          box([CENTRE[0] - 0.05, CENTRE[1] - 0.025], 0.025, 0.014, agenticHeat.RAMP[2], 'Prüfgebiet'),
        ],
      });
    }
  }

  async function show(next) {
    index = (next + gallery.samples.length) % gallery.samples.length;
    const sample = gallery.samples[index];
    $('kind').textContent = sample.kind === 'none' ? 'Basis' : sample.kind;
    $('title').textContent = sample.title;
    $('question').textContent = sample.question;
    $('note').textContent = sample.note;
    $('count').textContent = (index + 1) + ' / ' + gallery.samples.length;
    map.map.easeTo({ center: CENTRE, zoom: sample.zoom, duration: 900 });
    await build(sample);
  }

  $('next').addEventListener('click', () => show(index + 1));
  $('prev').addEventListener('click', () => show(index - 1));
  document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight' || event.key === ' ') show(index + 1);
    if (event.key === 'ArrowLeft') show(index - 1);
  });

  // Applied once the first style is up, not before: the mount finishes by
  // installing the payload's default view, which would overwrite an earlier
  // call and leave the gallery sitting on aerial imagery — the busiest
  // possible substrate, and the very thing this palette exists to replace.
  map.map.once('idle', () => {
    map.setView('map-light');
    map.setFlavorOverride(window.agenticCanvasFlavor());
    map.map.once('idle', () => show(0));
  });
})();
</script>
</body>
</html>
